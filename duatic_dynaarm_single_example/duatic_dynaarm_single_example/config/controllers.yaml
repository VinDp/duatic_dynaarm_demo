/**:
  controller_manager:
    ros__parameters:

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
        state: active

      dynaarm_status_broadcaster:
        type: duatic_dynaarm_controllers/StatusBroadcaster
        state: active

      gravity_compensation_controller:
        type: duatic_dynaarm_controllers/GravityCompensationController
        state: active

      freedrive_controller:
        type: duatic_dynaarm_controllers/FreeDriveController
        state: inactive

      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController
        state: inactive

      freeze_controller:
        type: duatic_dynaarm_controllers/FreezeController
        state: active

      virtual_fts:
        type: duatic_dynaarm_controllers/ForceTorqueBroadcaster
        state: active

      pid_controller:
        type: pid_controller/PidController
        state: inactive

      gripper_action_controller:
        type: parallel_gripper_action_controller/GripperActionController
        state: inactive
        #is_async: true
        #thread_priority: 40

/**/joint_state_broadcaster:
  ros__parameters:
    use_urdf_to_filter: false
    joints:
      - shoulder_rotation
      - shoulder_flexion
      - elbow_flexion
      - forearm_rotation
      - wrist_flexion
      - wrist_rotation

/**/dynaarm_status_broadcaster:
  ros__parameters:
    joints:
      - shoulder_rotation
      - shoulder_flexion
      - elbow_flexion
      - forearm_rotation
      - wrist_flexion
      - wrist_rotation

/**/virtual_fts:
  ros__parameters:
    joints:
      - shoulder_rotation
      - shoulder_flexion
      - elbow_flexion
      - forearm_rotation
      - wrist_flexion
      - wrist_rotation
    endeffector_frame: "flange"
    use_svd_solver: true

/**/joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_rotation
      - shoulder_flexion
      - elbow_flexion
      - forearm_rotation
      - wrist_flexion
      - wrist_rotation
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    # See https://control.ros.org/jazzy/doc/ros2_controllers/joint_trajectory_controller/doc/parameters.html for a full list of all parameters
    allow_partial_joints_goal: false # trajectory needs to contains goals from all joints handled by the controller
    allow_nonzero_velocity_at_trajectory_end: true
    # set_last_command_interface_value_as_state_on_activation: false
    constraints:
      stopped_velocity_tolerance: 0.5
      goal_time: 0.05
      # Tolerances for each joint
      shoulder_rotation: { trajectory: 0.5, goal: 0.05 }
      shoulder_flexion: { trajectory: 0.5, goal: 0.05 }
      elbow_flexion: { trajectory: 0.5, goal: 0.05 }
      forearm_rotation: { trajectory: 0.5, goal: 0.05 }
      wrist_flexion: { trajectory: 0.5, goal: 0.05 }
      wrist_rotation: { trajectory: 0.5, goal: 0.05 }

/**/gravity_compensation_controller:
  ros__parameters:
    joints:
      - shoulder_rotation
      - shoulder_flexion
      - elbow_flexion
      - forearm_rotation
      - wrist_flexion
      - wrist_rotation

/**/freedrive_controller:
  ros__parameters:
    joints:
      - shoulder_rotation
      - shoulder_flexion
      - elbow_flexion
      - forearm_rotation
      - wrist_flexion
      - wrist_rotation

/**/freeze_controller:
  ros__parameters:
    names:
      - DynaarmSystem

/**/gripper_action_controller:
  ros__parameters:
    action_monitor_rate: 20.0 # Hz
    joint: robotiq_hande_left_finger_joint
    goal_tolerance: 0.01 # m
    allow_stalling: false
    stall_velocity_threshold: 0.001 # m/s
    stall_timeout: 1.0 # s
    max_effort_interface: ""
    max_effort: 10.0 # N
    max_velocity_interface: ""
    max_velocity: 0.1 # m/s
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

/**/pid_controller:
  ros__parameters:

    dof_names:
      - shoulder_rotation
      - shoulder_flexion
      - elbow_flexion
      - forearm_rotation
      - wrist_flexion
      - wrist_rotation

    command_interface: effort

    reference_and_state_interfaces:
      - position
      - velocity   # optional but recommended

    use_external_measured_states: false

    gains:
      shoulder_rotation:
        p: 80.0
        i: 0.0
        d: 2.0
      shoulder_flexion:
        p: 80.0
        i: 0.0
        d: 2.0
      elbow_flexion:
        p: 80.0
        i: 0.0
        d: 2.0
      forearm_rotation:
        p: 60.0
        i: 0.0
        d: 1.0
      wrist_flexion:
        p: 60.0
        i: 0.0
        d: 1.0
      wrist_rotation:
        p: 60.0
        i: 0.0
        d: 1.0

